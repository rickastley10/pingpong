<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ping pong</title>
<style>
    body {
    margin: 0;
    background: #111;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    width: 100vw;
    height: 100vh;
}
    canvas {
    background: black;
    touch-action: none;

    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const WINDOW_WIDTH = 400;
const WINDOW_HEIGHT = 400;
const w = 40;
const h = 40;

/* ============================================================
   GLOBALS
   ============================================================ */
const canvas = document.getElementById("game");
canvas.width = WINDOW_WIDTH;
canvas.height = WINDOW_HEIGHT;

const ctx = canvas.getContext("2d");

let running = true;
let dir = "right";

/* ============================================================
   INPUT
   ============================================================ */
const keys = {};

window.addEventListener("keydown", (e) => {
    keys[e.key] = true;
});

window.addEventListener("keyup", (e) => {
    keys[e.key] = false;
});

/* ============================================================
   UNIVERSAL INPUT (Single handler for Mouse + Touch)
   ============================================================ */
function handleInput(e) {
    e.preventDefault();
    
    let clientX, clientY;
    if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY; 
    } else {
        clientX = e.clientX;
        clientY = e.clientY;  
    }
    
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;  
    
    // Scale coordinates to match canvas size
    const scaleX = WINDOW_WIDTH / rect.width;
    const scaleY = WINDOW_HEIGHT / rect.height;
    const canvasX = x * scaleX;
    const canvasY = y * scaleY;
    if(175 < canvasX && canvasX < 225 && canvasY < 50){
        if(pause===0){
            pause=1
        }
        else{
            pause=0
        }
    }
    else if(canvasX < 200){
        if(pause===0){
            paddle1goto=canvasY
        }
        else if (pause===1){
            if(player1AI===0){
                player1AI=1
            }
            else{
                player1AI=0
            }
        }
        
    }
    else if(canvasX > 200){
        if(pause===0){
            paddle2goto=canvasY
        }
        else if (pause===1){
            if(player2AI===0){
                player2AI=1
            }
            else{
                player2AI=0
            }
        }
    }
    

}

canvas.addEventListener("touchstart", handleInput);
canvas.addEventListener("mousedown", handleInput);

/* ============================================================
   GAME STATE
   ============================================================ */
function reset(){
    paddle1X=50
    paddle1Y=200
    paddle1Direction=0      // 1 - up, 2 - down, 0 - no movement
    paddle1goto=999


    paddle2X=350
    paddle2Y=200
    paddle2Direction=0      // 1 - up, 2 - down, 0 - no movement
    paddle2goto=999


    ballX=180
    ballY=200
    ballVelocityX=5
    ballVelocityY=5
    ballDirection=2        // 1 - up, 2 - down, 0 - no movement
}


reset()
player1Score = 0
player2Score = 0

player1AI = 0
player2AI = 0

pause = 0
/* ============================================================
   MAIN LOOP
   ============================================================ */
function game_loop() {
    if (!running) return;
            if (keys[" "]){
                if(pause===0){
                    pause=1
                }
                else{
                    pause=0
                }
            }
            if (keys["p"]){
                if(pause===0){
                    pause=1
                }
                else{
                    pause=0
                }
            }
    if(pause===0){
            
            ctx.font = "15px Arial";

            //controls

            //keyboard
            




            if (keys["w"]){
                if(paddle1Y>0){
                    paddle1Y=paddle1Y-20
                }
                paddle1Direction = 1
            }
            else if (keys["s"]){
                if(paddle1Y<350){
                    paddle1Y=paddle1Y+20
                }
                paddle1Direction = 2
            }
            else{
                paddle1Direction = 0
            }

            if (keys["ArrowUp"]){
                if(paddle2Y>0){
                    paddle2Y=paddle2Y-20
                }
                paddle2Direction = 1
            }
            else if (keys["ArrowDown"]){
                if(paddle2Y<350){
                    paddle2Y=paddle2Y+20
                }
                paddle2Direction = 2
            }
            else{
                paddle2Direction = 0
            }

            //mouse / touch

            //paddle 1
            if(paddle1goto !== 999){
            
                if(paddle1goto > paddle1Y+30){
                    paddle1Y += 20
                    paddle1Direction=2
                    if(paddle1Y > 350) paddle1Y = 350
                }
                else if(paddle1goto < paddle1Y +10){
                    paddle1Y -= 20
                    paddle1Direction=1
                    if(paddle1Y < 0) paddle1Y = 0
                }
                else{
                    paddle1goto = 999
                    paddle1Direction=0
                }
            }

            //paddle 2
            if(paddle2goto !== 999){
            
                if(paddle2goto > paddle2Y+30){
                    paddle2Y += 20
                    paddle2Direction=2
                    if(paddle2Y > 350) paddle2Y = 350
                }
                else if(paddle2goto < paddle2Y +10){
                    paddle2Y -= 20
                    paddle2Direction=1
                    if(paddle2Y < 0) paddle2Y = 0
                }
                else{
                    paddle2goto = 999
                    paddle1Direction=0
                }
            }

            if(player1AI === 1){
                paddle1goto = ballY
            }

            if(player2AI === 1){
                paddle2goto = ballY
            }

            //logic

            //ball movement
            ballX = ballX + ballVelocityX
            ballY = ballY + ballVelocityY
            
            //wall bouncing logic
            if(ballX>= 400){
                player1Score += 1
                reset()
            }
            if(ballX -20 <= 0){
                player2Score += 1
                reset()
            }
            if(ballY + 20 >= 400){
                ballVelocityY = -ballVelocityY
                ballDirection= 1
            }
            if(ballY <= 0){
                ballVelocityY = -ballVelocityY
                ballDirection= 2
            }

            //paddle collision
            if(ballX <= paddle1X + 10 && ballY < paddle1Y+50 && ballY+20 > paddle1Y){
                ballVelocityX = -ballVelocityX
                
                //ball acceleration
                if(ballDirection === paddle1Direction){
                    ballVelocityY = ballVelocityY * 1.25
                }
                else if((ballDirection === 1 && paddle1Direction === 2) || (ballDirection === 2 && paddle1Direction === 1)){
                    ballVelocityY = ballVelocityY * 0.75
                }

            }

            if(ballX + 20 >= paddle2X && ballY < paddle2Y+50 && ballY+20 > paddle2Y){
                ballVelocityX = -ballVelocityX

                //ball acceleration
                if(ballDirection === paddle2Direction){
                    ballVelocityY = ballVelocityY * 1.25
                }
                else if((ballDirection === 1 && paddle2Direction === 2) || (ballDirection === 2 && paddle2Direction === 1)){
                    ballVelocityY = ballVelocityY * 0.75
                }

            }



            /* ===== RENDER ===== */


    }
        //clear screen
        ctx.fillStyle="#000000"
        ctx.fillRect(0, 0, WINDOW_WIDTH, WINDOW_HEIGHT)


        //rendering

        //paddle 1
        ctx.fillStyle="#ff0000"
        ctx.fillRect(paddle1X, paddle1Y, 10, 50)

        //paddle 2
        ctx.fillStyle="#0000ff"
        ctx.fillRect(paddle2X, paddle2Y, 10, 50)

        //ball
        ctx.fillStyle="#ffffff"
        ctx.fillRect(ballX, ballY, 20, 20)

        //score
        ctx.font = "30px Arial";
        ctx.fillStyle="#FF0000"
        ctx.fillText(player1Score, 80, 100)

        ctx.font = "30px Arial";
        ctx.fillStyle="#0000FF"
        ctx.fillText(player2Score, 320, 100)


        
        
        ctx.font = "30px Arial";
        ctx.fillStyle="#999999"
        ctx.fillText("||", 200, 50)
        
        if (pause===1){
            if(player1AI===1){
                ctx.font = "30px Arial";
                ctx.fillStyle="#999999"
                ctx.fillText("AI: ON", 20, 200)
            }
            else if(player1AI===0){
                ctx.font = "30px Arial";
                ctx.fillStyle="#999999"
                ctx.fillText("AI: OFF", 20, 200)
            }

            if(player2AI===1){
                ctx.font = "30px Arial";
                ctx.fillStyle="#999999"
                ctx.fillText("AI: ON", 300, 200)
            }
            else if(player2AI===0){
                ctx.font = "30px Arial";
                ctx.fillStyle="#999999"
                ctx.fillText("AI: OFF", 280, 200)
            }
            
        }



    setTimeout(() => {
        requestAnimationFrame(game_loop);
    }, 50);
}

game_loop();
</script>
</body>
</html>
