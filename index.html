<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>pong</title>
<style>
    body {
        margin: 0;
        background: #111;
        overflow: hidden;
    }
    canvas {
        display: block;
        margin: auto;
        background: black;
        touch-action: none;
        width: 100vw;
        height: 100vh;
    }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const WINDOW_WIDTH = 400;
const WINDOW_HEIGHT = 400;
const w = 20;
const h = 20;

/* ============================================================
   GLOBALS
   ============================================================ */
const canvas = document.getElementById("game");
canvas.width = WINDOW_WIDTH;
canvas.height = WINDOW_HEIGHT;

const ctx = canvas.getContext("2d");

let running = true;
let dir = "right";

/* ============================================================
   INPUT
   ============================================================ */
const keys = {};

window.addEventListener("keydown", (e) => {
    keys[e.key] = true;
});

window.addEventListener("keyup", (e) => {
    keys[e.key] = false;
});

/* ============================================================
   UNIVERSAL INPUT (Single handler for Mouse + Touch)
   ============================================================ */
function handleInput(e) {
    e.preventDefault();
    
    let clientX, clientY;
    if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY; 
    } else {
        clientX = e.clientX;
        clientY = e.clientY;  
    }
    
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;  
    
    // Scale coordinates to match canvas size
    const scaleX = WINDOW_WIDTH / rect.width;
    const scaleY = WINDOW_HEIGHT / rect.height;
    const canvasX = x * scaleX;
    const canvasY = y * scaleY;
    
    if(canvasX > 150&& canvasX < 250 && canvasY < 100){
        if(ai===0){ai=1}
        else{ai=0}
    }

    // Left half - controls Player 1
    if (canvasX < WINDOW_WIDTH / 2) {
        if (canvasY > WINDOW_HEIGHT / 2) {
            if(p1y <=400-ph*2){
                p1y=p1y+ph
            }
        } else {
            if(p1y >= 0+ph){
                p1y=p1y-ph
            }
        }
    }
    // Right half - controls Player 2
    else {
        if (canvasY > WINDOW_HEIGHT / 2) {
            if(p2y <=400-ph*2){
                p2y=p2y+ph
            }
        } else {
            if(p2y >= 0+ph){
                p2y=p2y-ph
            }
        }
    }
}

canvas.addEventListener("touchstart", handleInput);
canvas.addEventListener("mousedown", handleInput);

/* ============================================================
   GAME STATE
   ============================================================ */
let bx = 200
let by = 200
let vx = 5
let vy = 5

let score1=0
let score2=0

let pw=w/2
let ph=w*4

let p1x=40
let p1y=0

let p2x=360
let p2y=0

let ai=0

let x=0 // temporary buffer 
/* ============================================================
   MAIN LOOP
   ============================================================ */
function game_loop() {
    if (!running) return;

    /* ===== UPDATE ===== */
    if (keys["w"]){
        if(p1y >=0){
            p1y=p1y-h
        }
    }
    if (keys["s"]){
        if(p1y <=400-ph){
            p1y=p1y+h
        }
    }
    if (keys["ArrowUp"]){
        if(p2y >=0){
            p2y=p2y-h
        }
    }
    if (keys["ArrowDown"]){
        if(p2y <=400-ph){
            p2y=p2y+h
        }
    }

    /* ===== RENDER ===== */
    //clear screen
    ctx.fillStyle="#000000"
    ctx.fillRect(0, 0, WINDOW_WIDTH, WINDOW_HEIGHT)

    ctx.fillStyle="#ffffff"
    ctx.fillRect(bx, by, w, h)

    ctx.fillStyle="#FF0000"
    ctx.fillRect(p1x, p1y, pw, ph)

    ctx.fillStyle="#0000FF"
    ctx.fillRect(p2x, p2y, pw, ph)
    
    while(x<10){
        ctx.fillStyle="#ffffff"
        ctx.fillRect(200-2, x*40, 4, 30)
        x=x+1
    }
    x=0
    // Your original bouncing logic
    bx=bx+vx
    by=by+vy

    if (ai===1){
        if(by>p2y){p2y=p2y+ph}
        if(by<p2y){p2y=p2y-ph}

        if(1===2){
            if(by>p1y){p1y=p1y+ph}
            if(by<p1y){p1y=p1y-ph}
        }
    }


    if((bx >= 400)){
        by=200;bx=200;vx=5;vy=5; score1=score1+1;
    }
    if((bx <= 0)){
        by=200;bx=200;vx=5;vy=5; score2=score2+1;
    }
    if((by+20 >= 400) || (by <= 0)){
        vy=vy*(-1)
        by=by+vy
    }

    if((bx <= p1x + pw) && (bx + w >= p1x) && (by <= p1y + ph) && (by + h >= p1y) && vx < 0){
        vx=vx*(-1)
        bx = p1x + pw;

        if(vx<=0){
            vx=vx-1
        }
        else{
            vx=vx+1
        }
    }
    if((bx + w >= p2x) && (bx <= p2x + pw) && (by <= p2y + ph) && (by + h >= p2y) && vx > 0){
        vx=vx*(-1)
        bx = p2x - w;
        

        if(vx<=0){
            vx=vx-1
        }
        else{
            vx=vx+1
        }
    }

    ctx.fillStyle="#FF0000"
    ctx.fillText(score1, 150, 100)
    ctx.fillStyle="#0000FF"
    ctx.fillText(score2, 250, 100)
    setTimeout(() => {
        requestAnimationFrame(game_loop);
    }, 50);
}

game_loop();
</script>
</body>
</html>
